{{ define "main" }}
<main id="main-content" class="content-shell site-shell">
  <section class="article" aria-labelledby="list-title">
    <p class="eyebrow">{{ .Title }}</p>
    <h1 id="list-title">{{ .Title }}</h1>
    {{ with .OutputFormats.Get "rss" }}<p class="text-link"><a href="{{ .RelPermalink }}">Subscribe via RSS</a></p>{{ end }}
    <div class="post-list">
      {{ range .Pages }}
      <article>
        <p><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
        <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </article>
      {{ end }}
    </div>
  </section>
</main>
{{ end }}
